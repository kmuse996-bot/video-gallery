<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영상프롬 갤러리</title>
<meta name="theme-color" content="#0d0e12">
<style>
  :root{--bg:#0d0e12;--card:#16181f;--card2:#1d2029;--line:#2a2e3a;--text:#e9eaf0;--muted:#9097a8;--accent:#ff7a59;--accent2:#7c8cff}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:rgba(13,14,18,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar{max-width:1280px;margin:0 auto;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.3px}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .status{color:var(--muted);font-size:12px;margin-right:auto}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;min-width:180px;outline:none}
  input[type=search]:focus{border-color:var(--accent2)}
  .btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--accent2)}
  main{max-width:1280px;margin:0 auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
  @media (max-width:420px){main{grid-template-columns:1fr;padding:12px;gap:14px}.bar{padding:12px}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .media{position:relative;background:#000;aspect-ratio:var(--ar,9/16);max-height:640px;width:100%;cursor:pointer;overflow:hidden}
  .media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .media:hover img{transform:scale(1.03)}
  .media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.55))}
  .play i{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
  .play i::after{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
  .badge{position:absolute;left:10px;top:10px;display:flex;gap:6px}
  .badge b{font-size:11px;font-weight:700;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);padding:3px 8px;border-radius:999px}
  .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
  .body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
  .title{font-weight:700;font-size:15px;word-break:break-all}
  .meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .meta a{color:var(--accent2);text-decoration:none}
  details{background:var(--card2);border:1px solid var(--line);border-radius:12px}
  summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--muted);transition:transform .2s}
  details[open] summary::before{transform:rotate(90deg)}
  summary .lang{font-size:10px;padding:2px 6px;border-radius:6px;background:#2b3042;color:#c9cff0}
  summary .copy{margin-left:auto}
  .copy{background:transparent;border:1px solid var(--line);color:var(--text);font-size:12px;border-radius:8px;padding:4px 9px;cursor:pointer}
  .copy.ok{border-color:#3bb273;color:#7ee2a8}
  .ptext{padding:0 12px 12px;font-size:13px;line-height:1.65;color:#cfd3df;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;max-height:340px;overflow:auto}
  .preview{padding:0 12px 10px;font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
  details[open] .preview{display:none}
  .empty,.err{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 10px}
  .skel{height:520px;border-radius:16px;background:linear-gradient(90deg,#15171d,#1c1f27,#15171d);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  footer{color:var(--muted);font-size:11px;text-align:center;padding:10px 0 30px}
</style>
</head>
<body>
<header><div class="bar">
  <h1>🎬 <span>영상프롬</span> 갤러리</h1>
  <div class="status" id="status">불러오는 중…</div>
  <div class="tools">
    <input type="search" id="q" placeholder="파일명·프롬프트 검색">
    <button class="btn" id="refresh">↻ 새로고침</button>
    <a class="btn" id="sheetLink" target="_blank" rel="noopener">시트 열기</a>
  </div>
</div></header>
<main id="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<footer>구글 시트 '영상프롬'과 자동 연동 · 1분마다 자동 갱신</footer>
<script>
(function(){
  var SHEET_ID = "134ZE8aVQlCcgW9dnMynFGc84a5k1yg0dq-JNgGxYzbs";
  var GID = "0";
  var REFRESH_MS = 60000;
  var grid = document.getElementById("grid"), statusEl = document.getElementById("status"), q = document.getElementById("q");
  document.getElementById("sheetLink").href = "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit#gid="+GID;
  var entries = [], lastSig = null, playing = {};

  function cellText(c){ if(!c) return ""; if(c.f!=null) return String(c.f); if(c.v==null) return ""; return String(c.v); }
  function extractId(s){ if(!s) return ""; var m = String(s).match(/(?:\/d\/|[?&]id=)([A-Za-z0-9_-]{15,})/); if(m) return m[1]; m = String(s).trim().match(/^[A-Za-z0-9_-]{20,}$/); return m ? m[0] : ""; }
  function norm(s){ return String(s||"").replace(/\s+/g,"").toLowerCase(); }

  function parse(resp){
    var t = resp.table, cols = t.cols.map(function(c){ return norm(c.label||""); });
    function idx(names, fallback){ for(var i=0;i<names.length;i++){ var k = cols.findIndex(function(l){ return l.indexOf(norm(names[i]))===0; }); if(k>=0) return k; } return fallback; }
    var I = { date:idx(["날짜"],0), file:idx(["파일명"],1), vlink:idx(["영상링크"],2), img:idx(["시작이미지"],3), len:idx(["길이"],4), res:idx(["해상도"],5),
              en:idx(["영어프롬프트","영어프롬","영문"],6), ko:idx(["한글프롬프트","한글프롬"],7), vid:idx(["영상id"],8), iid:idx(["이미지id"],9), meta:idx(["메타"],10) };
    var out = [];
    t.rows.forEach(function(r, n){
      var c = r.c || []; function g(k){ return I[k]>=0 ? cellText(c[I[k]]) : ""; }
      var meta = g("meta").split("|");
      var e = {
        row: n+2,
        date: meta[0] || g("date"),
        file: g("file").trim(),
        len: meta[1] || g("len"),
        res: meta.length>2 ? meta.slice(2).join("|") : g("res"),
        en: g("en").trim(), ko: g("ko").trim(),
        vid: extractId(g("vid")) || extractId(g("vlink")),
        iid: extractId(g("iid")) || extractId(g("img"))
      };
      if(!e.file && !e.vid && !e.en && !e.ko) return;
      out.push(e);
    });
    out.sort(function(a,b){ var d = (b.date||"").localeCompare(a.date||""); return d!==0 ? d : b.row - a.row; });
    return out;
  }

  function esc(s){ return String(s).replace(/[&<>"']/g,function(ch){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]; }); }

  function copyText(txt, btn){
    function done(){ btn.classList.add("ok"); btn.textContent="복사됨 ✓"; setTimeout(function(){ btn.classList.remove("ok"); btn.textContent="복사"; },1500); }
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(done, fallback); } else fallback();
    function fallback(){ var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ alert("복사에 실패했어요"); } document.body.removeChild(ta); }
  }

  function promptBlock(label, lang, text){
    if(!text) return "";
    return '<details><summary>'+label+' <span class="lang">'+lang+'</span><button class="copy" type="button">복사</button></summary>'+
           '<div class="preview">'+esc(text)+'</div><div class="ptext">'+esc(text)+'</div></details>';
  }

  function render(){
    var term = q.value.trim().toLowerCase();
    var list = entries.filter(function(e){ return !term || (e.file+" "+e.en+" "+e.ko+" "+e.date).toLowerCase().indexOf(term)>=0; });
    if(!list.length){ grid.innerHTML = '<div class="empty">'+(entries.length?"검색 결과가 없어요":"아직 등록된 영상이 없어요")+'</div>'; return; }
    grid.innerHTML = "";
    list.forEach(function(e){
      var key = e.row+"|"+e.vid;
      var card = document.createElement("article"); card.className="card";
      var imgUrl = e.iid ? "https://lh3.googleusercontent.com/d/"+e.iid+"=w900" : "";
      var media = '<div class="media">'+
        (imgUrl ? '<img loading="lazy" alt="'+esc(e.file)+' 시작 이미지" src="'+imgUrl+'">' : '<div class="noimg">시작 이미지 없음</div>')+
        '<div class="play"><i></i></div><div class="badge">'+(e.len?'<b>'+esc(e.len)+'</b>':'')+(e.res?'<b>'+esc(e.res)+'</b>':'')+'</div></div>';
      card.innerHTML = media + '<div class="body"><div class="title">'+esc(e.file||"(파일명 없음)")+'</div>'+
        '<div class="meta"><span>📅 '+esc(e.date||"-")+'</span>'+(e.len?'<span>⏱ '+esc(e.len)+'</span>':'')+(e.res?'<span>🎞 '+esc(e.res)+'</span>':'')+
        (e.vid?'<a href="https://drive.google.com/file/d/'+e.vid+'/view" target="_blank" rel="noopener">드라이브에서 열기 ↗</a>':'')+'</div>'+
        promptBlock("영어 프롬프트","EN",e.en)+promptBlock("한글 프롬프트","KO",e.ko)+'</div>';
      var m = card.querySelector(".media"), img = m.querySelector("img");
      if(img){
        img.onload = function(){ if(img.naturalWidth) m.style.setProperty("--ar", img.naturalWidth+"/"+img.naturalHeight); };
        img.onerror = function(){ if(!img.dataset.fb && e.iid){ img.dataset.fb=1; img.src="https://drive.google.com/thumbnail?id="+e.iid+"&sz=w900"; } };
      }
      function play(){
        if(!e.vid){ alert("이 행에는 영상 링크가 없어요"); return; }
        if(m.querySelector("iframe")) return;
        playing[key]=1;
        m.style.cursor="default";
        var f=document.createElement("iframe"); f.src="https://drive.google.com/file/d/"+e.vid+"/preview"; f.allow="autoplay; fullscreen"; f.allowFullscreen=true;
        m.appendChild(f); var p=m.querySelector(".play"); if(p) p.remove();
      }
      m.addEventListener("click", play);
      if(playing[key]) play();
      card.querySelectorAll("details").forEach(function(d){
        var txt = d.querySelector(".ptext").textContent;
        d.querySelector(".copy").addEventListener("click", function(ev){ ev.preventDefault(); ev.stopPropagation(); copyText(txt, this); });
      });
      grid.appendChild(card);
    });
  }

  var cbN = 0;
  function load(manual){
    var name = "__vg_cb" + (++cbN), s = document.createElement("script"), timer;
    window[name] = function(resp){
      clearTimeout(timer); delete window[name]; s.remove();
      if(!resp || resp.status!=="ok"){ statusEl.textContent = "시트를 읽지 못했어요 (공유 설정 확인)"; return; }
      var t = new Date(), stamp = t.getHours().toString().padStart(2,"0")+":"+t.getMinutes().toString().padStart(2,"0");
      if(resp.sig !== lastSig || manual){ lastSig = resp.sig; entries = parse(resp); render(); }
      statusEl.textContent = "영상 "+entries.length+"개 · "+stamp+" 갱신";
    };
    s.src = "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?gid="+GID+"&headers=1&tqx=out:json;responseHandler:"+name+"&_="+Date.now();
    s.onerror = function(){ statusEl.textContent = "연결 오류 – 잠시 후 다시 시도해요"; if(!entries.length) grid.innerHTML='<div class="err">시트에 연결하지 못했어요. 인터넷 연결이나 시트 공유 설정을 확인해 주세요.</div>'; };
    timer = setTimeout(function(){ statusEl.textContent = "응답 지연 중…"; }, 15000);
    document.head.appendChild(s);
  }
  q.addEventListener("input", render);
  document.getElementById("refresh").addEventListener("click", function(){ load(true); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) load(); });
  setInterval(function(){ if(!document.hidden) load(); }, REFRESH_MS);
  load();
})();
</script>
</body>
</html>
