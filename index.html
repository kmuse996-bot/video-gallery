<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영상프롬 갤러리</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d0e12">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  :root{--bg:#0d0e12;--card:#16181f;--card2:#1d2029;--line:#2a2e3a;--text:#e9eaf0;--muted:#9097a8;--accent:#ff7a59;--accent2:#7c8cff}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:rgba(13,14,18,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar{max-width:none;margin:0 auto;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.3px}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .status{color:var(--muted);font-size:12px;margin-right:auto}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;min-width:180px;outline:none}
  input[type=search]:focus{border-color:var(--accent2)}
  .btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--accent2)}
  main{max-width:none;margin:0 auto;padding:18px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
  @media (min-width:2200px){main{grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:24px;padding:24px 32px}.media{max-height:900px}h1{font-size:26px}}
  @media (max-width:420px){main{grid-template-columns:1fr;padding:12px;gap:14px}.bar{padding:12px}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .media{position:relative;background:#000;aspect-ratio:var(--ar,9/16);max-height:640px;width:100%;cursor:pointer;overflow:hidden}
  .media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .media:hover img{transform:scale(1.03)}
  .media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.55))}
  .play i{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
  .play i::after{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
  .badge{position:absolute;left:10px;top:10px;display:flex;gap:6px}
  .badge b{font-size:11px;font-weight:700;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);padding:3px 8px;border-radius:999px}
  .media.hosted{cursor:default}
  .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .media .badge{pointer-events:none;z-index:2}
  .xp{position:absolute;right:10px;top:10px;z-index:3;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:5px 9px;font-size:12px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .xp:hover{background:rgba(0,0,0,.8);border-color:var(--accent2)}
  .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
  .body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
  .title{font-weight:700;font-size:15px;word-break:break-all}
  .meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .meta a{color:var(--accent2);text-decoration:none}
  details{background:var(--card2);border:1px solid var(--line);border-radius:12px}
  summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--muted);transition:transform .2s}
  details[open] summary::before{transform:rotate(90deg)}
  summary .lang{font-size:10px;padding:2px 6px;border-radius:6px;background:#2b3042;color:#c9cff0}
  summary .copy{margin-left:auto}
  .copy{background:transparent;border:1px solid var(--line);color:var(--text);font-size:12px;border-radius:8px;padding:4px 9px;cursor:pointer}
  .copy.ok{border-color:#3bb273;color:#7ee2a8}
  .ptext{padding:0 12px 12px;font-size:13px;line-height:1.65;color:#cfd3df;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;max-height:340px;overflow:auto}
  .preview{padding:0 12px 10px;font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
  details[open] .preview{display:none}
  .empty,.err{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 10px}
  .skel{height:520px;border-radius:16px;background:linear-gradient(90deg,#15171d,#1c1f27,#15171d);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  footer{color:var(--muted);font-size:11px;text-align:center;padding:10px 0 30px}

  #viewer{position:fixed;inset:0;z-index:50;background:rgba(5,6,9,.97);display:none;grid-template-columns:1fr minmax(320px,26vw);}
  #viewer.on{display:grid}
  #viewer .stage{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;height:100vh}
  #viewer video{max-width:100%;max-height:100vh;width:auto;height:100vh;object-fit:contain;background:#000}
  #viewer iframe{width:100%;height:100vh;border:0}
  #viewer .side{border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;height:100vh}
  #viewer .side .ptext{max-height:none}
  #viewer .vbtn{position:absolute;z-index:3;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:50%;width:52px;height:52px;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #viewer .vbtn:hover{background:rgba(255,255,255,.25)}
  #vClose{top:18px;right:18px} #vPrev{left:18px;top:50%;transform:translateY(-50%)} #vNext{right:18px;top:50%;transform:translateY(-50%)} #vFull{top:18px;right:84px;font-size:18px}
  #viewer.noside{grid-template-columns:1fr} #viewer.noside .side{display:none}
  #vSide{top:18px;right:150px;font-size:16px}
  @media (max-width:900px){#viewer{grid-template-columns:1fr;grid-template-rows:auto 1fr}#viewer .stage,#viewer video{height:62vh}#viewer .side{height:auto;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<style>
  #lock{position:fixed;inset:0;z-index:100;background:#0d0e12;display:flex;align-items:center;justify-content:center}
  #lock form{background:#16181f;border:1px solid #2a2e3a;border-radius:18px;padding:32px 28px;display:flex;flex-direction:column;gap:14px;width:min(360px,90vw);text-align:center}
  #lock h2{margin:0;font-size:20px} #lock p{margin:0;color:#9097a8;font-size:13px}
  #lock input{background:#0d0e12;border:1px solid #2a2e3a;color:#e9eaf0;border-radius:10px;padding:12px;font-size:16px;text-align:center;outline:none}
  #lock input:focus{border-color:#7c8cff} #lock button{background:linear-gradient(90deg,#ff7a59,#7c8cff);border:0;color:#fff;font-weight:700;border-radius:10px;padding:12px;font-size:15px;cursor:pointer}
  #lock .bad{color:#ff7a7a;font-size:13px;min-height:18px}
  body.locked > :not(#lock){visibility:hidden}
</style>
<div id="lock"><form id="lockForm"><h2>🔒 영상프롬 갤러리</h2><p>비밀번호를 입력하세요</p><input type="password" id="lockPw" autocomplete="current-password" autofocus><button type="submit">열기</button><div class="bad" id="lockBad"></div><label style="font-size:12px;color:#9097a8"><input type="checkbox" id="lockKeep" checked style="vertical-align:middle"> 이 기기에서 기억하기</label></form></div>
<script>
(function(){ var H="b06a275c29a167f72e41697e97de062da5874d28961ec4fc76803a569fd1f914", K="vg_unlock";
  document.body.classList.add("locked");
  function ok(){ document.body.classList.remove("locked"); var l=document.getElementById("lock"); if(l) l.remove(); }
  if(localStorage.getItem(K)===H || sessionStorage.getItem(K)===H){ ok(); return; }
  async function sha(t){ var b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join(""); }
  document.getElementById("lockForm").addEventListener("submit", async function(ev){ ev.preventDefault();
    var h=await sha("vg-salt-kmuse:"+document.getElementById("lockPw").value);
    if(h===H){ (document.getElementById("lockKeep").checked?localStorage:sessionStorage).setItem(K,H); ok(); }
    else { document.getElementById("lockBad").textContent="비밀번호가 맞지 않아요"; document.getElementById("lockPw").select(); } });
})();
</script>
<header><div class="bar">
  <h1>🎬 <span>영상프롬</span> 갤러리</h1>
  <div class="status" id="status">불러오는 중…</div>
  <div class="tools">
    <input type="search" id="q" placeholder="파일명·프롬프트 검색">
    <button class="btn" id="refresh">↻ 새로고침</button>
    <a class="btn" id="sheetLink" target="_blank" rel="noopener">시트 열기</a>
  </div>
</div></header>
<main id="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<div id="viewer"><div class="stage" id="vStage"><button class="vbtn" id="vPrev" title="이전 (←)">‹</button><button class="vbtn" id="vNext" title="다음 (→)">›</button><button class="vbtn" id="vSide" title="프롬프트 숨기기/보이기 (P)">☰</button><button class="vbtn" id="vFull" title="전체 화면 (F)">⛶</button><button class="vbtn" id="vClose" title="닫기 (Esc)">✕</button></div><div class="side" id="vInfo"></div></div>
<footer>시트(Drive) + 로컬 업로드(videos/) 연동 · 1분마다 자동 갱신 · Drive 새 영상은 약 15분 안에 페이지 플레이어로 전환</footer>
<script>
(function(){
  var SHEET_ID = "134ZE8aVQlCcgW9dnMynFGc84a5k1yg0dq-JNgGxYzbs";
  var GID = "0";
  var REFRESH_MS = 60000;
  var grid = document.getElementById("grid"), statusEl = document.getElementById("status"), q = document.getElementById("q");
  document.getElementById("sheetLink").href = "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit#gid="+GID;
  var entries = [], lastSig = null, playing = {};

  function cellText(c){ if(!c) return ""; if(c.f!=null) return String(c.f); if(c.v==null) return ""; return String(c.v); }
  function extractId(s){ if(!s) return ""; var m = String(s).match(/(?:\/d\/|[?&]id=)([A-Za-z0-9_-]{15,})/); if(m) return m[1]; m = String(s).trim().match(/^[A-Za-z0-9_-]{20,}$/); return m ? m[0] : ""; }
  function norm(s){ return String(s||"").replace(/\s+/g,"").toLowerCase(); }

  function parse(resp){
    var t = resp.table, cols = t.cols.map(function(c){ return norm(c.label||""); });
    function idx(names, fallback){ for(var i=0;i<names.length;i++){ var k = cols.findIndex(function(l){ return l.indexOf(norm(names[i]))===0; }); if(k>=0) return k; } return fallback; }
    var I = { date:idx(["날짜"],0), file:idx(["파일명"],1), vlink:idx(["영상링크"],2), img:idx(["시작이미지"],3), len:idx(["길이"],4), res:idx(["해상도"],5),
              en:idx(["영어프롬프트","영어프롬","영문"],6), ko:idx(["한글프롬프트","한글프롬"],7), vid:idx(["영상id"],8), iid:idx(["이미지id"],9), meta:idx(["메타"],10) };
    var out = [];
    t.rows.forEach(function(r, n){
      var c = r.c || []; function g(k){ return I[k]>=0 ? cellText(c[I[k]]) : ""; }
      var meta = g("meta").split("|");
      var e = {
        row: n+2,
        date: meta[0] || g("date"),
        file: g("file").trim(),
        len: meta[1] || g("len"),
        res: meta.length>2 ? meta.slice(2).join("|") : g("res"),
        en: g("en").trim(), ko: g("ko").trim(),
        vid: extractId(g("vid")) || extractId(g("vlink")),
        iid: extractId(g("iid")) || extractId(g("img"))
      };
      if(!e.file && !e.vid && !e.en && !e.ko) return;
      out.push(e);
    });
    out.sort(function(a,b){ var d = (b.date||"").localeCompare(a.date||""); return d!==0 ? d : a.row - b.row; });
    return out;
  }

  function esc(s){ return String(s).replace(/[&<>"']/g,function(ch){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]; }); }

  function copyText(txt, btn){
    function done(){ btn.classList.add("ok"); btn.textContent="복사됨 ✓"; setTimeout(function(){ btn.classList.remove("ok"); btn.textContent="복사"; },1500); }
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(done, fallback); } else fallback();
    function fallback(){ var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ alert("복사에 실패했어요"); } document.body.removeChild(ta); }
  }

  function promptBlock(label, lang, text){
    if(!text) return "";
    return '<details><summary>'+label+' <span class="lang">'+lang+'</span><button class="copy" type="button">복사</button></summary>'+
           '<div class="preview">'+esc(text)+'</div><div class="ptext">'+esc(text)+'</div></details>';
  }


  // ---- self-hosted videos (Drive sync: videos/<driveId>.mp4 + index.json; local uploads: videos/local.json) ----
  var hosted = {};
  var localEntries = [];
  function loadHosted(){
    return fetch("videos/index.json?_="+Date.now(), {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : []; })
      .then(function(a){ var h={}; (a||[]).forEach(function(id){ h[id]=1; }); hosted=h; }).catch(function(){});
  }
  function loadLocal(){
    return fetch("videos/local.json?_="+Date.now(), {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : []; })
      .then(function(a){
        localEntries = (a||[]).map(function(x, i){
          var id = String(x.id||"").trim();
          if(!id) return null;
          var video = x.video || ("videos/"+id+".mp4");
          var poster = x.poster || "";
          return {
            row: -(i+1),
            date: x.date || "",
            file: (x.title || x.file || id).trim(),
            len: x.len || x.length || "",
            res: x.res || x.resolution || "",
            en: (x.en||"").trim(),
            ko: (x.ko||"").trim(),
            vid: id,
            iid: "",
            local: true,
            video: video,
            poster: poster,
            ratio: x.ratio || ""
          };
        }).filter(Boolean);
      }).catch(function(){ localEntries = []; });
  }
  function isHosted(e){ return !!(e.local || e.video || (e.vid && hosted[e.vid])); }
  function selfUrl(e){ return e.video || ("videos/"+encodeURIComponent(e.vid)+".mp4"); }
  function posterUrl(e, w){
    if(e.poster) return e.poster;
    return e.iid ? "https://lh3.googleusercontent.com/d/"+e.iid+"="+(w||"w900") : "";
  }
  function driveLink(e){ return (!e.local && e.vid) ? ('<a href="https://drive.google.com/file/d/'+e.vid+'/view" target="_blank" rel="noopener">드라이브에서 열기 ↗</a>') : ''; }
  function mergeEntries(sheetRows){
    var out = sheetRows.concat(localEntries);
    out.sort(function(a,b){
      var d = (b.date||"").localeCompare(a.date||"");
      if(d!==0) return d;
      // local (negative row) after same-date sheet rows by title, else sheet row order
      if(a.local!==b.local) return a.local ? 1 : -1;
      return a.row - b.row;
    });
    return out;
  }

  // only one video plays at a time
  document.addEventListener("play", function(ev){
    document.querySelectorAll("video").forEach(function(v){ if(v!==ev.target && !v.paused) v.pause(); });
  }, true);
  function anyPlaying(){ var p=false; grid.querySelectorAll("video").forEach(function(v){ if(!v.paused && !v.ended) p=true; }); return p; }
  var pendingRender = false;
  document.addEventListener("pause", function(){ if(pendingRender && !anyPlaying()){ pendingRender=false; render(); } }, true);

  var vList=[], vIdx=-1, V=document.getElementById("viewer"), VS=document.getElementById("vStage"), VI=document.getElementById("vInfo");
  function closeViewer(){ V.classList.remove("on"); var m=VS.querySelector("video,iframe"); if(m){ if(m.pause) m.pause(); m.remove(); } document.body.style.overflow=""; if(document.fullscreenElement) document.exitFullscreen().catch(function(){}); vIdx=-1; }
  window.openViewer=function(i, startAt){ vList=currentList; if(i<0||i>=vList.length) return; vIdx=i; var e=vList[i];
    grid.querySelectorAll("video").forEach(function(v){ if(!v.paused) v.pause(); });
    var old=VS.querySelector("video,iframe"); if(old){ if(old.pause) old.pause(); old.remove(); }
    function iframeFallback(){ var f=document.createElement("iframe"); f.src="https://drive.google.com/file/d/"+e.vid+"/preview"; f.allow="autoplay; fullscreen"; f.allowFullscreen=true; VS.insertBefore(f, VS.firstChild); }
    if(!e.vid && !e.video){ /* nothing to play */ }
    else if(isHosted(e)){
      var v=document.createElement("video"); v.src=selfUrl(e); v.controls=true; v.autoplay=true; v.playsInline=true; v.setAttribute("playsinline",""); v.preload="auto";
      if(e.iid) v.poster=posterUrl(e,"w1600");
      if(startAt) v.addEventListener("loadedmetadata", function(){ try{ v.currentTime=startAt; }catch(_){} }, {once:true});
      v.onerror=function(){ v.remove(); if(!e.local) iframeFallback(); };
      VS.insertBefore(v, VS.firstChild); var pr=v.play(); if(pr&&pr.catch) pr.catch(function(){});
    } else iframeFallback();
    VI.innerHTML='<div class="title" style="font-size:18px">'+esc(e.file||"")+'</div><div class="meta"><span>📅 '+esc(e.date||"-")+'</span>'+(e.len?'<span>⏱ '+esc(e.len)+'</span>':'')+(e.res?'<span>🎞 '+esc(e.res)+'</span>':'')+driveLink(e)+'<span>'+(i+1)+' / '+vList.length+'</span></div>'+
      promptBlock("영어 프롬프트","EN",e.en).replace("<details>","<details open>")+promptBlock("한글 프롬프트","KO",e.ko).replace("<details>","<details open>");
    VI.querySelectorAll("details").forEach(function(d){ var t=d.querySelector(".ptext").textContent; d.querySelector(".copy").addEventListener("click",function(ev){ ev.preventDefault(); ev.stopPropagation(); copyText(t,this); }); });
    V.classList.add("on"); document.body.style.overflow="hidden";
    document.getElementById("vPrev").style.visibility=i>0?"visible":"hidden"; document.getElementById("vNext").style.visibility=i<vList.length-1?"visible":"hidden";
  };
  document.getElementById("vClose").onclick=closeViewer;
  document.getElementById("vPrev").onclick=function(){ openViewer(vIdx-1); };
  document.getElementById("vNext").onclick=function(){ openViewer(vIdx+1); };
  document.getElementById("vSide").onclick=function(){ V.classList.toggle("noside"); };
  document.getElementById("vFull").onclick=function(){ if(document.fullscreenElement) document.exitFullscreen(); else V.requestFullscreen&&V.requestFullscreen(); };
  document.addEventListener("keydown",function(ev){ if(vIdx<0) return; if(ev.target.tagName==="INPUT") return;
    if(ev.key==="Escape"&&!document.fullscreenElement) closeViewer(); else if(ev.key==="ArrowLeft") openViewer(vIdx-1); else if(ev.key==="ArrowRight") openViewer(vIdx+1);
    else if(ev.key==="f"||ev.key==="F") document.getElementById("vFull").click(); else if(ev.key==="p"||ev.key==="P") V.classList.toggle("noside"); });

  var currentList=[], cards = {}; // key -> {el, sig}
  function buildCard(e){
    var card = document.createElement("article"); card.className="card";
    var imgUrl = posterUrl(e), self = isHosted(e);
    var badge = '<div class="badge">'+(e.len?'<b>'+esc(e.len)+'</b>':'')+(e.res?'<b>'+esc(e.res)+'</b>':'')+'</div>';
    var xp = e.vid ? '<button class="xp" type="button" title="크게 보기">크게 ⛶</button>' : '';
    var media = self
      ? '<div class="media hosted"><video controls preload="metadata" playsinline'+(imgUrl?' poster="'+imgUrl+'"':'')+' src="'+selfUrl(e)+'"></video>'+xp+'</div>'
      : '<div class="media">'+(imgUrl ? '<img loading="lazy" alt="'+esc(e.file)+' 시작 이미지" src="'+imgUrl+'">' : '<div class="noimg">시작 이미지 없음</div>')+
        '<div class="play"><i></i></div>'+badge+xp+'</div>';
    card.innerHTML = media + '<div class="body"><div class="title">'+esc(e.file||"(파일명 없음)")+'</div>'+
      '<div class="meta"><span>📅 '+esc(e.date||"-")+'</span>'+(e.len?'<span>⏱ '+esc(e.len)+'</span>':'')+(e.res?'<span>🎞 '+esc(e.res)+'</span>':'')+
      driveLink(e)+'</div>'+
      promptBlock("영어 프롬프트","EN",e.en)+promptBlock("한글 프롬프트","KO",e.ko)+'</div>';
    var m = card.querySelector(".media"), img = m.querySelector("img"), vid = m.querySelector("video");
    if(vid){
      if(e.ratio) m.style.setProperty("--ar", e.ratio);
      vid.addEventListener("loadedmetadata", function(){ if(vid.videoWidth) m.style.setProperty("--ar", vid.videoWidth+"/"+vid.videoHeight); });
      vid.addEventListener("error", function(){ // self-hosted file missing → fall back to image + Drive
        if(card.dataset.fb) return; card.dataset.fb=1; hosted[e.vid]=0; var key=keyOf(e); delete cards[key]; var n=buildCard(e); card.replaceWith(n); cards[key]={el:n, sig:sigOf(e)}; });
      if(imgUrl && e.iid){ var pi=new Image(); pi.onerror=function(){ vid.poster="https://drive.google.com/thumbnail?id="+e.iid+"&sz=w900"; }; pi.src=imgUrl; }
    }
    if(img){
      img.onload = function(){ if(img.naturalWidth) m.style.setProperty("--ar", img.naturalWidth+"/"+img.naturalHeight); };
      img.onerror = function(){ if(!img.dataset.fb && e.iid){ img.dataset.fb=1; img.src="https://drive.google.com/thumbnail?id="+e.iid+"&sz=w900"; } };
      m.addEventListener("click", function(ev){ if(ev.target.closest(".xp")) return; if(!e.vid){ alert("이 행에는 영상 링크가 없어요"); return; } openViewer(idxOfKey(keyOf(e))); });
    }
    var xb = m.querySelector(".xp");
    if(xb) xb.addEventListener("click", function(ev){ ev.preventDefault(); ev.stopPropagation(); var t = vid ? vid.currentTime : 0; openViewer(idxOfKey(keyOf(e)), t); });
    card.querySelectorAll("details").forEach(function(d){
      var txt = d.querySelector(".ptext").textContent;
      d.querySelector(".copy").addEventListener("click", function(ev){ ev.preventDefault(); ev.stopPropagation(); copyText(txt, this); });
    });
    card._entry = e;
    return card;
  }
  function idxOfKey(k){ for(var i=0;i<currentList.length;i++) if(keyOf(currentList[i])===k) return i; return -1; }
  function keyOf(e){ return (e.local?"L":"S")+":"+e.vid+"|"+e.row; }
  function sigOf(e){ return JSON.stringify([e.date,e.file,e.len,e.res,e.en,e.ko,e.vid,e.iid,e.video,e.poster,e.ratio,isHosted(e)]); }

  function render(){
    var term = q.value.trim().toLowerCase();
    var list = entries.filter(function(e){ return !term || (e.file+" "+e.en+" "+e.ko+" "+e.date).toLowerCase().indexOf(term)>=0; });
    currentList = list;
    // drop skeleton / empty placeholders
    Array.prototype.slice.call(grid.children).forEach(function(c){ if(!c.classList.contains("card")) c.remove(); });
    var keep = {};
    list.forEach(function(e, i){
      var key = keyOf(e), sig = sigOf(e), c = cards[key];
      if(c && c.sig === sig){ c.el._entry = e; }
      else {
        var playing = c && c.el.querySelector("video") && !c.el.querySelector("video").paused;
        if(c && playing){ /* don't destroy a playing video; update later */ pendingRender = true; c.el._entry = e; }
        else { var n = buildCard(e); if(c) c.el.replaceWith(n); c = cards[key] = {el:n, sig:sig}; }
      }
      keep[key] = 1;
      var at = grid.children[i];
      if(at !== c.el) grid.insertBefore(c.el, at || null);
    });
    Object.keys(cards).forEach(function(k){ if(!keep[k]){ var v=cards[k].el.querySelector("video"); if(v && !v.paused){ v.pause(); } cards[k].el.remove(); delete cards[k]; } });
    if(!list.length){ var d=document.createElement("div"); d.className="empty"; d.textContent = entries.length?"검색 결과가 없어요":"아직 등록된 영상이 없어요"; grid.appendChild(d); }
  }

  var cbN = 0;
  function load(manual){
    var name = "__vg_cb" + (++cbN), s = document.createElement("script"), timer;
    window[name] = function(resp){
      clearTimeout(timer); delete window[name]; s.remove();
      if(!resp || resp.status!=="ok"){ statusEl.textContent = "시트를 읽지 못했어요 (공유 설정 확인)"; return; }
      var t = new Date(), stamp = t.getHours().toString().padStart(2,"0")+":"+t.getMinutes().toString().padStart(2,"0");
      var hBefore = JSON.stringify(hosted);
      Promise.all([loadHosted(), loadLocal()]).then(function(){
        var hChanged = JSON.stringify(hosted) !== hBefore;
        var next = mergeEntries(parse(resp));
        var nextSig = resp.sig + "|L" + localEntries.length + "|" + JSON.stringify(localEntries.map(function(x){return x.vid+":"+(x.video||"")+":"+(x.poster||"");}));
        if(nextSig !== lastSig || manual || hChanged){ lastSig = nextSig; entries = next;
          if(!manual && anyPlaying()) pendingRender = true; else render(); }
        statusEl.textContent = "영상 "+entries.length+"개 · "+stamp+" 갱신";
      });
    };
    s.src = "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?gid="+GID+"&headers=1&tqx=out:json;responseHandler:"+name+"&_="+Date.now();
    s.onerror = function(){ statusEl.textContent = "연결 오류 – 잠시 후 다시 시도해요"; if(!entries.length) grid.innerHTML='<div class="err">시트에 연결하지 못했어요. 인터넷 연결이나 시트 공유 설정을 확인해 주세요.</div>'; };
    timer = setTimeout(function(){ statusEl.textContent = "응답 지연 중…"; }, 15000);
    document.head.appendChild(s);
  }
  q.addEventListener("input", render);
  document.getElementById("refresh").addEventListener("click", function(){ load(true); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) load(); });
  setInterval(function(){ if(!document.hidden) load(); }, REFRESH_MS);
  load();
})();
</script>
</body>
