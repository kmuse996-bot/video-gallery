name: sync-videos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-videos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for new ids
        id: check
        run: |
          curl -fsSL "https://docs.google.com/spreadsheets/d/134ZE8aVQlCcgW9dnMynFGc84a5k1yg0dq-JNgGxYzbs/gviz/tq?gid=0&headers=1&tqx=out:csv&tq=select%20I" \
            | tail -n +2 | tr -d '"\r' | grep -E '^[A-Za-z0-9_-]{20,}$' | sort -u > /tmp/ids.txt || true
          missing=0
          while read -r id; do [ -s "videos/$id.mp4" ] || { echo "new: $id"; missing=1; }; done < /tmp/ids.txt
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg
        if: steps.check.outputs.missing == '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Download new videos from Drive
        if: steps.check.outputs.missing == '1'
        run: ./scripts/sync-videos.sh
      - name: Commit and push
        if: always() && steps.check.outputs.missing == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos
          if git diff --cached --quiet; then echo "no new videos"; exit 0; fi
          git commit -m "sync videos from sheet"
          git pull --rebase origin main
          git push origin HEAD:main
